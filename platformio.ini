; platformio.ini — PlatformIO alternative build for the Quilt VM.
;
; PlatformIO is a nice alternative to plain ESP-IDF when you
; want a quick `pio run -t upload` without setting IDF_PATH.
; The Quilt VM substrate is plain C99, so it builds on any
; ESP32 target — the canonical run is on ESP32-S3.
;
; Usage:
;   pio run -e esp32s3 -t upload
;   pio run -e esp32 -t upload
;   pio test -e native         # run the 5 unit tests on the host
;
; The 5 opcodes are the runtime. C is the desert. The ESP32
; is the open range.

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; Firmware: ESP32-S3, the preferred target. ESP-NOW is built in.
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCONFIG_IDF_TARGET=esp32s3
    -DQVM_HERD_KEY_DEFAULT=1
src_build_flags = -Iinclude
build_src_flags = -Wno-unused-variable

; ---------------------------------------------------------------------------
; Firmware: original ESP32, for older boards in the herd.
; ---------------------------------------------------------------------------
[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCONFIG_IDF_TARGET=esp32
    -DQVM_HERD_KEY_DEFAULT=1
src_build_flags = -Iinclude

; ---------------------------------------------------------------------------
; Unit tests: run on the host (no ESP-IDF, no WiFi).
; Just the 5 opcodes in plain C. BIND, LINK, EFFECT, VIEW, TICK.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags = -std=c99 -Wall -Wextra -O2 -Iinclude
build_src_flags = -DQUILT_VM_HOST_BUILD=1
test_build_src = yes
test_filter = test_*

; ---------------------------------------------------------------------------
; Unit tests: run on the ESP32-S3 itself, via PlatformIO Unity.
; ---------------------------------------------------------------------------
[env:esp32s3_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
    -DCONFIG_IDF_TARGET=esp32s3
    -DQVM_HERD_KEY_DEFAULT=1
    -Iinclude
test_build_src = yes
test_filter = test_*

; Common settings for all envs
[env]
lib_deps =
