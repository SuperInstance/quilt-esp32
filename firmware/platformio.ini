; platformio.ini — limb-blink quilt signal cell
; ESP32 DevKit V1 (esp32dev) + Arduino framework, no lib_deps

[platformio]
src_dir          = src

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc/vm

build_src_filter =
    +<*> -<reflex/> -<nmea/>

; Path B — ESP32-S3 (the "-WROOM-1" board that enumerates). DevKitC-1 style:
; addressable RGB LED on GPIO48 (some revs use 38 — -DRGB_PIN overrides).
[env:esp32s3]
platform          = espressif32
board             = esp32-s3-devkitc-1
framework         = arduino
monitor_speed     = 115200
upload_speed     = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc/vm
    -DTARGET_ESP32S3
    -DRGB_PIN=48

build_src_filter =
    +<*> -<reflex/> -<nmea/>

; reflex-arc — the critic's frozen 6-channel gate on metal (2026-08-26).
; Integer-only judge compiled from critic-gate.qm (gate_qm.h); replay
; vectors arrive over UART. Radio dark by firmware (WiFi off, BT stopped).
[env:reflex_arc]
platform          = espressif32
board             = esp32-s3-devkitc-1
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc/reflex

build_src_filter =
    +<reflex/>

; nmea lane — the vessel limb: NMEA 0183 on UART0 → sheet cells → rules → LED
[env:nmea]
platform          = espressif32
board             = esp32-s3-devkitc-1
framework         = arduino
monitor_speed     = 115200
upload_speed     = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc/vm
    -Isrc/nmea
    -DTARGET_ESP32S3
    -DRGB_PIN=48

build_src_filter =
    +<vm/>
    +<qm_serve.c>
    +<qm_opcodes.c>
    +<qm_tables.h>
    +<nmea/>
    -<main.cpp>
