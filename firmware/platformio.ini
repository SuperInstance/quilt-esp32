; platformio.ini — limb-blink quilt signal cell
; ESP32 DevKit V1 (esp32dev) + Arduino framework, no lib_deps

[platformio]
src_dir          = src

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc/vm

; Path B — ESP32-S3 (the "-WROOM-1" board that enumerates). DevKitC-1 style:
; addressable RGB LED on GPIO48 (some revs use 38 — -DRGB_PIN overrides).
[env:esp32s3]
platform          = espressif32
board             = esp32-s3-devkitc-1
framework         = arduino
monitor_speed     = 115200
upload_speed     = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc/vm
    -DTARGET_ESP32S3
    -DRGB_PIN=48
