; platformio.ini — limb-blink quilt signal cell
; ESP32 DevKit V1 (esp32dev) + Arduino framework, no lib_deps

[platformio]
src_dir          = src

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc/vm
